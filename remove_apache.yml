---

- hosts: db,file
  become: true
  tasks:

  - name: install updates (Rocky)
    tags: always
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution in ["Rocky"]

  - name: install updates (Debian)
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution in ["Debian"]

  - name: remove apache and php package
    apt:
      name:
        - apache2
        - libapache2-mod-php
      state: absent
    when: ansible_distribution == "Debian"

  - name: remove apache and php package
    dnf:
      name: 
        - httpd
        - php
      state: absent
    when: ansible_distribution == "Rocky"
