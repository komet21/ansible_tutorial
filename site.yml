---

- hosts: all
  become: true
  pre_tasks:

  - name: install updates (Rocky)
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution in ["Rocky"]

  - name: install updates (Debian)
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution in ["Debian"]

- hosts: web
  become: true
  tasks:

  - name: install apache and php for Debian
    apt:
      name:
        - apache2
        - libapache2-mod-php
      state: latest
    when: ansible_distribution in ["Debian"]

  - name: install apache and php for Rocky
    dnf:
      name:
        - httpd
        - php
      state: latest
    when: ansible_distribution in ["Rocky"]

- hosts: db
  become: true
  tasks:

  - name: install mariadb package (Debian)
    apt:
      name: mariadb-server
      state: latest
    when: ansible_distribution in ["Debian"]

  - name: install mariadb package (Rocky)
    dnf:
      name:
        - mariadb
        - mariadb-server
      state: latest
    when: ansible_distribution in ["Rocky"]

- hosts: file
  become: yes
  tasks:

  - name: install samba package
    package:
      name: samba
